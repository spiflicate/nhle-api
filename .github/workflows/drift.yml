# Calls every library function against the live NHL APIs and compares
# the response shapes with scripts/drift/baseline.json. It runs on its
# own schedule, never on PRs, so an upstream API change never blocks
# unrelated work.
#
# On the default branch, drift opens (or refreshes) one issue labelled
# api-drift. The issue is the alert: the run itself passes once the issue
# is filed, so an unfixed drift doesn't send a failed-run notification
# every day. Each run merges its findings into those the issue already
# lists, so a finding a later run doesn't see (date-dependent data, a
# one-off outage) stays listed until it is resolved. New findings are
# posted as a comment, since GitHub doesn't notify on body edits. The
# issue is closed once a run finds nothing open.
#
# The run fails when the check crashes, the issue can't be filed, or it
# drifts outside the default branch, where no issue is filed.
name: API drift

on:
  schedule:
    - cron: '23 9 * * *' # daily, 09:23 UTC, when no NHL games are live
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: api-drift
  cancel-in-progress: false

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ON_DEFAULT_BRANCH: ${{ github.ref_name == github.event.repository.default_branch }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile

      - name: Load the open drift issue
        id: issue
        if: env.ON_DEFAULT_BRANCH == 'true'
        run: |
          issue=$(gh issue list --label api-drift --state open \
            --json number --jq '.[0].number')
          echo "number=$issue" >> "$GITHUB_OUTPUT"
          if [ -n "$issue" ]; then
            gh issue view "$issue" --json body --jq .body > previous.md
          fi

      - name: Check the live APIs
        id: check
        continue-on-error: true
        run: |
          bun run drift --report drift-report.md \
            --previous previous.md --new drift-new.md

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-report
          path: drift-report.md
          if-no-files-found: ignore

      # A crash writes no report; the issue keeps its findings and the
      # run fails below instead.
      - name: Open or refresh the drift issue
        id: file
        if: >-
          steps.check.outcome == 'failure' &&
          env.ON_DEFAULT_BRANCH == 'true' &&
          hashFiles('drift-report.md') != ''
        env:
          ISSUE: ${{ steps.issue.outputs.number }}
        run: |
          printf '\n---\nLatest run: %s\n' "$RUN_URL" >> drift-report.md
          gh label create api-drift --color d93f0b \
            --description 'The live NHL APIs no longer match the library' \
            2>/dev/null || true
          if [ -n "$ISSUE" ]; then
            gh issue edit "$ISSUE" --body-file drift-report.md
            if [ -s drift-new.md ]; then
              printf '\n%s\n' "$RUN_URL" >> drift-new.md
              gh issue comment "$ISSUE" --body-file drift-new.md
            fi
          else
            gh issue create --label api-drift \
              --title 'NHL API drift detected' --body-file drift-report.md
          fi

      - name: Close the drift issue
        if: steps.check.outcome == 'success' && env.ON_DEFAULT_BRANCH == 'true'
        run: |
          for issue in $(gh issue list --label api-drift --state open \
            --json number --jq '.[].number'); do
            gh issue close "$issue" \
              --comment "The APIs match the baseline again: $RUN_URL"
          done

      - name: Fail the run on unfiled drift
        if: steps.check.outcome == 'failure' && steps.file.outcome != 'success'
        run: exit 1
